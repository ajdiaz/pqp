[package]
name = "pqp"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
ml-kem = { version = "0.3", features = ["getrandom", "zeroize"] }
ml-dsa = "0.1"
chacha20poly1305 = "0.11"
aes-gcm = "0.10"
rand = "0.8"
sha3 = "0.10"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
dirs = "5"
hex = "0.4"
zstd = "0.13"

flate2 = "1"
ascii85 = "0.1"
zeroize = { version = "1", features = ["zeroize_derive"] }

[dev-dependencies]
tempfile = "3"
